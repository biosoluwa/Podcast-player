<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Podcast player</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.0.1/css/all.min.css" integrity="sha512-2SwdPD6INVrV/lHTZbO2nodKhrnDdJK9/kg2XD1r9uGqPo1cUbujc+IYdlYdEErWNu69gVcYgdxlmVmzTWnetw==" crossorigin="anonymous" referrerpolicy="no-referrer" />    <link rel="stylesheet" href="index.css">
</head>
<body>
    <header>
        <div class="logo">
            <h1>Podcast Player</h1>
            <i class="fa-solid fa-microphone"></i>
        </div>
        <nav>
            <ul>
                <li>
                    <button>SEARCH</button>
                </li>
                <li>
                    <button>LISTEN</button>
                </li>
            </ul>
        </nav>
    </header>
    <main>
        <div class="search-bar">
            <div class="search-history" id="search-history">
                <span>Select a previous search</span>
                <div>
                    <span></span>
                    <span></span>
                </div>
                <div class="search-terms" id="search-terms"></div>
            </div>
            <form action="">
                <input type="search" id="search-input" placeholder="Search for a podcast" aria-label="Search bar for podcasts">
                <button type="submit" class="search-btn">Search</button>
                <button type="button" class="clear-btn" id="clear-btn">Clear history</button>
            </form>
        </div>   
        <div>
            <div class="result-container">
                <div class="animation-container">
                    <i class="fa-solid fa-microphone loading"></i>
                </div>
                <p class="error" id="error">Please enter a podcast title</p>
                <div class="container" id="container"></div>
            </div>
            <div></div>
            <div></div>
        </div>
    </main>
    <script src="index.js"></script>
</body>
</html>
